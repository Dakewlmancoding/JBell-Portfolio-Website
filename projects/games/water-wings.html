<!--
  ╔══════════════════════════════════════════════════════════╗
  ║  PROJECT PAGE TEMPLATE                                    ║
  ║  To write up a new project:                               ║
  ║  1. Copy this file into projects/<category>/ and rename   ║
  ║     it (e.g. projects/games/zen-dwarves.html)              ║
  ║  2. Pick a short, unique shorthand for the project (e.g.  ║
  ║     "SOA", "SBVR" — no formula, just make one up) and       ║
  ║     create assets/projects/<category>/<SHORTHAND>/, with  ║
  ║     images/ and videos/ (and audio/, if needed) inside.    ║
  ║     Set PROJECT_DIR below to that folder's path.            ║
  ║  3. Fill in the `card-data` JSON block AND the `project`  ║
  ║     object below — no HTML/CSS to write. Everything is    ║
  ║     rendered by renderProjectPage() in components.js.      ║
  ║  4. Add this file's path to assets/js/project-index.js —  ║
  ║     that's what makes it show up on games.html/tools.html/║
  ║     misc.html automatically. (Nothing to add for the Home  ║
  ║     page's Featured section — that's a hand-picked list    ║
  ║     of specific projects, edited directly in index.html.)  ║
  ║                                                             ║
  ║  Section jump-links and "Back to top" are generated        ║
  ║  automatically from the sections you list — you don't      ║
  ║  need to build navigation by hand.                          ║
  ║  `credits`, `heroMedia`, and `intro` are all optional —     ║
  ║  delete them if a project doesn't need one.                 ║
  ╚══════════════════════════════════════════════════════════╝
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Wings — Jack Bell</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="games">
  <div class="page-shell">
    <div id="site-nav"></div>

    <div id="page-body"></div>

    <div id="site-footer"></div>
  </div>

  <!-- Read by games.html/tools.html/misc.html (and index.html's Featured
       picks) to build this project's card — WITHOUT running any of the
       JS below or loading its media. Keep title/tagline/roles/tags here
       in sync with the same fields you'd otherwise repeat in `project`;
       the script below pulls them from here via `...card` so you only
       actually write them once. `thumbnail` is only used for the card. -->
  <script type="application/json" id="card-data">
    {
      "title": "Water Wings",
      "tagline": "A calming VR experience for hospice patients",
      "roles": "Sole Programmer; Composer",
      "tags": ["Unreal Engine", "VR"],
      "thumbnail": "/assets/projects/games/WW/images/splash.png"
    }
  </script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    // This project's shorthand folder — see step 2 above. Used below so
    // every media path only has the folder written once.
    const PROJECT_DIR = '/assets/projects/games/WW';

    const card = JSON.parse(document.getElementById('card-data').textContent);
    const project = {
      ...card,

      // Optional — delete this key if there's no single hero image/video.
      // For a local hero video (type: 'video'), it plays as a normal
      // player by default — controls shown, sound on, plays once. Add
      // muted: true, autoplay: true, loop: true to make it an autoplaying
      // background clip instead (the opposite of a body block's defaults).
      // A 'youtube' hero is always just a plain embed (see mediaType note
      // below — YouTube's own UI can't reliably be stripped down).
      heroMedia: { src: `https://www.youtube.com/watch?v=Z_TPawyzSVg`, type: 'youtube' },

      // Optional — delete this key if the project has no team to credit.
      credits: [
        { role: 'Programmer & Composer', name: 'Jack Bell (Yours Truly)' },
        { role: 'Artists (Models, Environment, Caustics)', name: 'Jenna Bresky, Katie Stevens, Rowan Bruton' },
        { role: 'Additional Caustics', name: 'Michael Cormican' },
      ],

      // Optional — shown between the credits table and the section
      // jump-nav. Same block shape as inside a section (see below).
      // Delete this key if the project doesn't need an intro blurb.
      intro: [
        {
          text: `In 10 weeks, our team of five created Water Wings: A VR experience intended for patients at a local Savannah hospice center, in collaboration with the Savannah College of Art and Design. I served as the sole programmer and composer. The experience was created with purposefully simple mechanics to be accessible to this demographic: older patients who might not have much mobility or gaming experience. We hoped to bring patients a reprieve from anxiety and pain by instilling them with a child-like sense of awe and wonder through a calming and beautiful experience tailored to their needs.`
          // No `media` key at all -> renders as plain, centered text
          // instead of the usual side-by-side text+media layout.
        }
      ],

      // One entry per top-level section. Each gets an auto-generated
      // jump-nav pill and a "Back to top" button — you don't write those
      // by hand. Sections are for general-audience info and are always
      // visible.
      sections: [
        {
          id: 'overview',              // used for the #anchor and jump-nav link
          heading: 'Overview',
          blocks: [                    // one or more text+media rows, top to bottom
            {
              text: `The game features a tour of an ancient underwater city, from the back of a magical manta ray — fittingly named Manta. Players stop at various key destinations to find and collect magical rune stones hidden somewhere in the scenery. Players must focus their gaze on a rune stone for 10 seconds to collect it, at which point Manta takes the player to the next vignette. At the end of their journey, all the collected stones come together, raising a tower from beneath the sand, and sending it spiraling up towards the sky. The Manta and the player spiral up with it, letting them take to the sky and fly among the clouds to end the experience.`,
              media: `${PROJECT_DIR}/images/splash.png`,
              mediaType: 'image',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `We utilised gaze-based tracking so patients could practice using some gentle motor skills (head tilting/rotating to find stones and look around the environment).
The game is best played sitting or lying down, since participants in the experience ride atop Manta. There is no joystick-based movement nor physical activity.
This did cause us to have some concerns about player agency, not wanting anyone to feel “stuck,” alarmed by being unable to move in VR, or even like they were drowning. We solved this by emphasising the magical and stylised tone of our environment through the game’s art as well as its sound and score.
`,
              media: `${PROJECT_DIR}/videos/gazedBased.mp4`,
              mediaType: 'video',
              muteToggle: false,
              hideControls: true
            },
          ],
        },
        {
          id: 'sound',              // used for the #anchor and jump-nav link
          heading: 'Sound Design',
          blocks: [                    // one or more text+media rows, top to bottom
            {
              text: `To help emphasise the fantastical mood, the game has no traditional sound effects. Instead, everything is represented by music. I wrote a 16-part score, with different parts representing different assets in the game, inspired by works like *Peter and the Wolf*.`,
            },
            {
              text: `The main score, on the harp and celesta, plays throughout the experience, while the rest of the parts are spatialised and follow the asset they represent.`,
              media: `${PROJECT_DIR}/audio/mainScore.wav`,
              mediaType: 'audio',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `When the player is taken by various schools of fish, they hear different woodwind sections, playing in time with the rest of the score, but spatialised to sound like they are coming from the fish themselves.`,
              media: `${PROJECT_DIR}/audio/bigFishA.wav`,
              mediaType: 'audio',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `“Hero parts” are tied to each key destination, and so are meant to stand out more than the other parts. This is done by either playing with the rhythmic structure of the score (such as stricter ¾ timing being used by the ballroom to create a waltz feel), or by using an instrument that stands out against the main score (such as the trumpet for the eagle statue).`,
              media: `${PROJECT_DIR}/audio/ballroom.wav`,
              mediaType: 'audio',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `“Rune Parts” are the only pieces of the score based on a counter melody, rather than a normal harmony, since they needed to stand out the most. They also use very unique instrumentation: a synth for the rune stone’s part and a women’s choir for the rune spire.`,
              media: `${PROJECT_DIR}/audio/runeStone.wav`,
              mediaType: 'audio',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `The entire 16-part score comes together to sound like this, although players will never hear it in full like this, due to the spatialisation.`,
              media: `${PROJECT_DIR}/audio/fullScore.wav`,
              mediaType: 'audio',
              muteToggle: false,
              hideControls: true
            },
          ],
        },
        {
          id: 'game-loop',              // used for the #anchor and jump-nav link
          heading: 'Gameplay Loop',
          blocks: [                    // one or more text+media rows, top to bottom
            {
              media: `${PROJECT_DIR}/images/gameLoop.png`,
              mediaType: 'image',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `Intro Cutscene
At the start of the game a cutscene plays, introducing Manta and Bubbles. Bubbles then explains the game to the player.`,
            },
            {
              text: `1-Gaze-Based: Player gets on Manta
Once the player has finished progressing through an area by finding its Rune Stone, they look at the Manta the manta ray, causing him to slowly move to the player.`,
              media: `${PROJECT_DIR}/videos/getOnManta.mp4`,
              mediaType: 'video',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `2-Dynamic Path Travel System
Once Manta has moved to be under the player, he and the player move slowly along a set path to the next scene. This gives the player plenty of time to look around and enjoy the scenery.`,
              media: `${PROJECT_DIR}/videos/pathTravelling.mp4`,
              mediaType: 'video',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `3-Automatically Dismounting Manta
Once Manta reaches the next stop at the end of its path, it moves down to the ground and places the player down. When the player has stopped moving, Manta will move away from the player, giving them an uninterrupted view of their surroundings, and Manta begins a looping animation, circling the current zone.`,
              media: `${PROJECT_DIR}/videos/autoDismount.mp4`,
              mediaType: 'video',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `4-Gaze-based Rune Discovery System
Each zone has a single rune stone for players to look around and find. Once the player finds the rune stone and looks at it long enough, the rune will gradually move towards the player. Once it arrives at the player, it will be ‘collected’ (represented by the rune now appearing on Manta) and the player can mount Manta again to repeat the loop in a new area.`,
              media: `${PROJECT_DIR}/videos/runeCollection.mp4`,
              mediaType: 'video',
              muteToggle: false,
              hideControls: true
            },
            {
              text: `Final Cutscene
After the last zone, the final cutscene plays. Manta and the player follow a rising tower out of the ocean and fly into the sky, ending the experience.`,
            },
          ],
        },
        {
          id: 'programming-philosophy',              // used for the #anchor and jump-nav link
          heading: 'Programming Philosophy: Dynamic Systems',
          blocks: [                    // one or more text+media rows, top to bottom
            {
              text: `When programming the game on such a short timeline, my philosophy was to keep everything as dynamic as possible. With a small team and a short timeline, our game’s scope was unstable. Every system in the gameplay loop was coded to be as adaptable as possible on short notice. Each zone lived in an easily expandable array. The first stop automatically iterated from the introduction cutscene, and the last stop automatically iterated into the final cutscene.  Each zone stop was a blueprint with dynamic variables for: the spline Manta took to get to the zone; the transform of the stop’s rune stone; and the texture/mesh for the stop’s rune stone.  This all meant adding a new zone was as easy as dragging in a new stop, creating a path to this stop from the last stop with a spline, setting the Runestone visuals, setting the runestone location/rotation/scale, and adding it to the master array.`,
            },
          ],
        }
        // Add as many sections (and subsections) as the project needs.
      ]
    };

    document.getElementById('page-body').innerHTML = renderProjectPage(project);
  </script>
</body>
</html>
