<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jack Bell — Gameplay Programmer/Designer</title>
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/assets/images/favicon-256.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="home">
  <div class="page-shell">
    <div id="site-nav"></div>

    <section class="hero">
      <div class="hero-photo" style="background-image:url('/assets/images/profile.jpg')"></div>
      <div class="hero-info">
        <h1 class="hero-name">JACK BELL</h1>
        <p class="hero-subtitle">Gameplay Programmer/Designer</p>
        <p class="hero-email">&#9993; jack@bellhastold.com</p>
        <p class="hero-bio">
          Technically minded designer with a proven history as a development lead.
          Specialising in XR Design, novel game mechanics, integrating discrete
          systems, and IoT applications.
        </p>
      </div>
    </section>

    <section>
      <h2 class="section-heading">Featured</h2>
      <div class="project-grid" id="featured-projects"></div>
    </section>

    <div id="site-footer"></div>
  </div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    // Featured is a hand-picked subset (unlike games.html/tools.html/misc.html,
    // which show every project in their category) — but the card content
    // itself still comes live from each project's own page, same as those.
    Promise.all([
      fetchProjectCard('/projects/games/sounds-of-adventure.html'),
      fetchProjectCard('/projects/games/sushi-ben.html'),
      fetchProjectCard('/projects/misc/arcane-melodies.html')
    ]).then((cards) => {
      document.getElementById('featured-projects').innerHTML = cards.filter(Boolean).join('');
    });
  </script>
</body>
</html>
